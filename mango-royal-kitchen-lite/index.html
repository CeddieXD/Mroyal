<!DOCTYPE html>
<html lang="en" class="staff-auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Royal Kitchen</title>
    <link rel="stylesheet" href="css/kitchen.css">
    <style>html.staff-auth-pending body > :not(#mr-auth-root) { visibility: hidden !important; }</style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="logo">MR</div>
            <div>
                <h1>Mango Royal Kitchen</h1>
                <p class="subtitle">Order Management</p>
            </div>
        </div>
        <div class="topbar-right">
            <div class="bell" id="bell" hidden>
                <span aria-hidden="true">🔔</span>
                <span class="bell-count" id="bell-count">0</span>
            </div>
            <span id="today" class="today"></span>
            <button id="sound-toggle" class="btn btn-ghost" type="button" aria-pressed="true">Mute sound</button>
            <button id="refresh-btn" class="btn btn-ghost" title="Refresh">↻</button>
        </div>
    </header>
    <div id="order-alerts" class="order-alerts" aria-live="polite" aria-atomic="false"></div>

    <nav class="tabs">
        <button class="tab active" data-filter="ALL">
            All Orders <span class="badge badge-gray" id="count-ALL">0</span>
        </button>
        <button class="tab" data-filter="VERIFIED">
            Incoming <span class="badge badge-yellow" id="count-VERIFIED">0</span>
        </button>
        <button class="tab" data-filter="PREPARING">
            Preparing <span class="badge badge-blue" id="count-PREPARING">0</span>
        </button>
        <button class="tab" data-filter="SERVED">
            Served <span class="badge badge-green" id="count-SERVED">0</span>
        </button>
    </nav>

    <main id="board" class="board"></main>

    <div id="empty-state" class="empty hidden">
        <div class="empty-icon">✓</div>
        <p>No orders in this category</p>
    </div>

    <script src="js/status-check.js"></script>
    <script>
        window.MANGO_ROYAL_STAFF_APP = {
            apiBase: window.KITCHEN_API_BASE || `${window.location.protocol}//${window.location.hostname}:3000`,
            role: 'kitchen',
            appLabel: 'Kitchen Display',
            appScript: 'js/app.js',
            module: true,
            sessionKey: 'mango-royal-kitchen-session',
        };
        const authScript = document.createElement('script');
        authScript.src = `${window.MANGO_ROYAL_STAFF_APP.apiBase}/staff-auth/staff-auth.js`;
        authScript.onerror = () => {
            document.documentElement.classList.remove('staff-auth-pending');
            document.body.textContent = 'The sign-in service is unavailable. Start the backend and reload this page.';
        };
        document.body.appendChild(authScript);
    </script>
</body>
</html>
