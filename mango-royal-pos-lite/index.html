<!DOCTYPE html>
<html lang="en" class="staff-auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Royal POS</title>
    <link rel="stylesheet" href="css/pos.css">
    <style>html.staff-auth-pending body > :not(#mr-auth-root) { visibility: hidden !important; }</style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="logo">MR</div>
            <div>
                <h1>Mango Royal POS</h1>
                <p class="subtitle">Order Management</p>
            </div>
        </div>
        <div class="topbar-right">
            <span id="today" class="today"></span>
            <button id="sound-toggle" class="btn btn-ghost" type="button" aria-pressed="true">Mute sound</button>
            <button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>
    </header>
    <div id="order-alerts" class="order-alerts" aria-live="polite" aria-atomic="false"></div>

    <nav class="tabs">
        <button class="tab active" data-status="PENDING">
            Incoming <span class="badge badge-yellow" id="count-PENDING">0</span>
        </button>
        <button class="tab" data-status="VERIFIED">
            Verified <span class="badge badge-green" id="count-VERIFIED">0</span>
        </button>
        <button class="tab" data-status="VOIDED">
            Void <span class="badge badge-gray" id="count-VOIDED">0</span>
        </button>
    </nav>

    <div class="toolbar">
        <input type="search" id="search" placeholder="Search by Order Number…">
        <button id="new-walkin-btn" class="btn btn-brand">+ New Walk-in Order</button>
        <button id="eod-receipt-btn" class="btn btn-ghost" type="button" hidden>🧾 END OF THE DAY RECEIPT</button>
        <button id="refresh-btn" class="btn btn-ghost" title="Refresh">↻</button>
    </div>
    <div id="selection-toolbar" class="selection-toolbar hidden" aria-live="polite">
        <span id="selection-status">Hold a pending order card to select it. Select up to 10 orders.</span>
        <div class="selection-actions">
            <button id="bulk-print-btn" class="btn btn-ghost" type="button">Print Selected</button>
            <button id="bulk-void-btn" class="btn btn-danger" type="button">Void Selected</button>
            <button id="clear-selection-btn" class="btn btn-outline" type="button">Clear Selection</button>
        </div>
    </div>

    <main id="orders-grid" class="orders-grid"></main>
    <p id="empty-state" class="empty hidden">No orders in this tab.</p>

    <div id="modal-root"></div>

    <script src="js/status-check.js"></script>
    <script>
        window.MANGO_ROYAL_STAFF_APP = {
            apiBase: window.POS_API_BASE || `${window.location.protocol}//${window.location.hostname}:3000`,
            role: 'pos',
            appLabel: 'Point of Sale',
            appScript: 'js/app.js',
            module: true,
            sessionKey: 'mango-royal-pos-session',
        };
        const authScript = document.createElement('script');
        authScript.src = `${window.MANGO_ROYAL_STAFF_APP.apiBase}/staff-auth/staff-auth.js`;
        authScript.onerror = () => {
            document.documentElement.classList.remove('staff-auth-pending');
            document.body.textContent = 'The sign-in service is unavailable. Start the backend and reload this page.';
        };
        document.body.appendChild(authScript);
    </script>
</body>
</html>
