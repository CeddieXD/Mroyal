<div class="ot-wrapper">
    <header class="ot-header">
        <img src="assets/img/MangoRoyalLogo.png" alt="" class="ot-logo">
        <h1>How would you like your order?</h1>
        <p>Please choose one to continue</p>
    </header>

    <div class="ot-choices">
        <button class="ot-card" data-type="Dine-in">
            <div class="ot-icon">🍽️</div>
            <h2>Dine In</h2>
            <p>Enjoy your shake here at our store</p>
        </button>
        <button class="ot-card" data-type="Take-out">
            <div class="ot-icon">🥤</div>
            <h2>Take Out</h2>
            <p>Grab and go — packed for the road</p>
        </button>
    </div>

    <button class="ot-back btn-ghost" id="ot-back">‹ Back</button>
</div>
