<div class="detail-content">
    <div class="detail-header">
        <button class="close-detail">‹ Back</button>
        <div class="detail-title">Customize</div>
        <span class="detail-spacer"></span>
    </div>

    <div class="detail-body">
        <div class="detail-left">
            <div class="detail-main-img">
                <div class="img-circle-bg"></div>
                <img id="detail-img" src="" alt="Product">
            </div>
        </div>

        <div class="detail-right">
            <h2 id="detail-name">Mango Royal</h2>

            <div class="detail-options">
                <p class="option-label">Shake Size</p>
                <div class="size-selector">
                    <div class="selection-pill"></div>
                    <button class="size-btn active">Tall</button>
                    <button class="size-btn">Grande</button>
                </div>

                <div class="qty-rating-row">
                    <div class="qty-selector">
                        <span>Qty</span>
                        <div class="qty-controls">
                            <button id="qty-minus">−</button>
                            <span id="qty-val">1</span>
                            <button id="qty-plus">+</button>
                        </div>
                    </div>
                </div>

                <div class="description">
                    <p class="option-label">Description</p>
                    <p id="detail-desc">Our signature mango royal milkshake is made from the freshest Philippine mangoes, blended to perfection with premium milk and topped with chewy pearls.</p>
                </div>
            </div>

            <div class="detail-footer">
                <div class="detail-price" data-base-price="0">₱0.00</div>
                <button class="add-to-cart-big">Add to Cart</button>
            </div>
        </div>
    </div>
</div>
