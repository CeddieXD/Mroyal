<div class="rev-wrapper">
    <header class="rev-header">
        <button class="btn btn-ghost" id="rev-back">‹ Back to Menu</button>
        <h1>Review Your Order</h1>
        <span class="rev-order-type" id="rev-order-type">Take Out</span>
    </header>

    <div class="rev-body">
        <div class="rev-items" id="rev-items"></div>

        <aside class="rev-summary">
            <h3>Order Summary</h3>
            <div class="summary-line"><span>Cups</span><span id="rev-count">0</span></div>
            <div class="summary-line"><span>Subtotal</span><span id="rev-subtotal">₱0.00</span></div>
            <div class="summary-line total"><span>Total</span><span id="rev-total">₱0.00</span></div>
            <button class="btn btn-primary rev-checkout" id="rev-checkout">Proceed to Payment →</button>
            <button class="btn btn-ghost rev-add-more" id="rev-add-more">+ Add more items</button>
        </aside>
    </div>
</div>
