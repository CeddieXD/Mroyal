<div class="menu-layout">

    <header class="menu-topbar">
        <div class="header-logo">
            <img src="assets/img/MangoRoyalLogo.png" alt="Logo">
            <span>Mango Royal</span>
        </div>

        <div class="search-bar-wrapper">
            <img src="assets/icons/search-icon.png" class="search-icon" alt="">
            <input type="text" id="menu-search" placeholder="Search shakes...">
        </div>
        <button class="start-again-button" id="start-again-button" type="button">Start Again</button>

    </header>

    <aside class="category-rail">
        <h3>Menu</h3>
        <div class="cat-item active" data-category="SEASONAL">
            <span class="cat-emoji">✨</span>
            <span>Limited Offers</span>
        </div>
        <div class="cat-item" data-category="PREMIUM">
            <span class="cat-emoji">💎</span>
            <span>Premium</span>
        </div>
        <div class="cat-item" data-category="BASIC">
            <span class="cat-emoji">🥭</span>
            <span>Basics</span>
        </div>
        <div class="cat-item" data-category="BEST_SELLERS">
            <span class="cat-emoji">⭐</span>
            <span>Best Sellers</span>
        </div>
    </aside>

    <div class="start-again-confirmation hidden" id="start-again-confirmation" role="dialog" aria-modal="true" aria-labelledby="start-again-title">
        <div class="start-again-card">
            <h2 id="start-again-title">Start a new order?</h2>
            <p>Your current cup and order will be cleared.</p>
            <div class="start-again-actions">
                <button class="start-again-cancel" id="start-again-cancel" type="button">Keep Ordering</button>
                <button class="start-again-confirm" id="start-again-confirm" type="button">Yes, Start Again</button>
            </div>
        </div>
    </div>

    <section class="product-section">
        <div class="product-categories"></div>
    </section>

    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-side-header">
            <h3>Your Order</h3>
            <span class="cart-count" id="cart-count">0 items</span>
        </div>

        <div class="cart-items-list" id="cart-items-list">
            <div class="cart-empty">
                <div class="cart-empty-icon" aria-hidden="true">🥤</div>
                <p>Your cup is empty</p>
                <small>Tap a shake to add it here</small>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-line"><span>Subtotal</span> <span id="subtotal">₱0.00</span></div>
            <div class="summary-line total"><span>Total</span> <span id="total-price">₱0.00</span></div>
            <button class="checkout-btn btn-primary" id="checkout-btn" disabled>Review Order →</button>
        </div>
    </aside>

</div>
