<div class="pay-wrapper">
    <header class="pay-header">
        <button class="btn btn-ghost" id="pay-back">‹ Back</button>
        <h1>Choose Payment</h1>
        <span class="pay-total-mini" id="pay-total-mini">₱0.00</span>
    </header>

    <div class="pay-body">
        <button class="pay-card selected" data-method="cash">
            <div class="pay-icon">💵</div>
            <h2>Pay at Counter</h2>
            <p>Cash · Please approach the cashier after ordering.</p>
        </button>
    </div>

    <div class="pay-footer">
        <div class="pay-total-row">
            <span>Total to pay</span>
            <span id="pay-total">₱0.00</span>
        </div>
        <button class="btn btn-primary pay-confirm" id="pay-confirm">Place Order</button>
    </div>
</div>
